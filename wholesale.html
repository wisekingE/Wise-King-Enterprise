<style>
:root{
  --ivory:#FBF8F2; --cream:#F4EEE0; --paper:#FFFFFF; --line:#E6DCC4;
  --ink:#2A2118; --ink-soft:#5C5142; --text-dim:#8A7D68;
  --gold:#B5893A; --gold-bright:#C9A24A; --gold-pale:#E8D9B5;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--ivory);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;}
img{max-width:100%;display:block;}
a{text-decoration:none;color:inherit;}
::selection{background:var(--gold-pale);color:var(--ink);}

.topbar{background:var(--ink);color:var(--gold-pale);text-align:center;font-size:11px;letter-spacing:0.1em;padding:9px 16px;font-weight:500;}
nav{position:sticky;top:0;z-index:200;background:rgba(251,248,242,0.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.nav-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;}
.brand-mark{display:flex;align-items:center;gap:10px;color:var(--ink);}
.logo-img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold);}
.brand-name{font-family:'Cinzel',serif;font-size:15px;letter-spacing:0.12em;font-weight:600;}
.back-link{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
.back-link:hover{color:var(--gold);}

section{padding:90px 24px;}
.sec-inner{max-width:1080px;margin:0 auto;}
.sec-eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;text-align:center;}
.sec-title{font-family:'Cinzel Decorative',serif;font-size:clamp(26px,3.6vw,36px);color:var(--ink);text-align:center;margin-bottom:20px;}
.sec-sub{max-width:640px;margin:0 auto 48px;text-align:center;font-size:14.5px;color:var(--ink-soft);line-height:1.85;font-weight:300;}

/* HERO */
.ws-hero{background:linear-gradient(165deg,var(--ink) 0%,#3D2A1A 100%);padding:0;}
.ws-hero-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;align-items:center;}
@media(max-width:860px){.ws-hero-inner{grid-template-columns:1fr;}}
.ws-hero-text{padding:80px 40px;color:var(--ivory);}
.ws-eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold-bright);margin-bottom:20px;}
.ws-title{font-family:'Cinzel Decorative',serif;font-size:clamp(30px,4.2vw,44px);line-height:1.15;margin-bottom:22px;}
.ws-sub{font-size:15px;color:rgba(251,248,242,0.75);line-height:1.85;margin-bottom:32px;font-weight:300;max-width:440px;}
.ws-cta-row{display:flex;gap:14px;flex-wrap:wrap;}
.ws-btn-fill{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;background:var(--gold-bright);color:var(--ink);padding:16px 30px;border-radius:2px;transition:all .25s ease;}
.ws-btn-fill:hover{background:#fff;}
.ws-btn-outline{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;background:transparent;color:rgba(251,248,242,0.85);border:1px solid rgba(201,162,74,0.4);padding:16px 30px;border-radius:2px;}
.ws-btn-outline:hover{border-color:var(--gold-bright);color:var(--gold-bright);}
.ws-hero-img{height:100%;min-height:340px;overflow:hidden;}
.ws-hero-img img{width:100%;height:100%;object-fit:cover;}

/* TRUST STRIP */
.ws-trust{background:var(--cream);padding:36px 24px;}
.ws-trust-row{max-width:1080px;margin:0 auto;display:flex;justify-content:center;gap:32px;flex-wrap:wrap;}
.ws-trust-item{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:0.03em;color:var(--ink-soft);font-weight:500;}
.ws-trust-item .tick{color:var(--gold);font-weight:700;}

/* BULK PRODUCTS */
.bulk-section{background:var(--paper);}
.bulk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media(max-width:860px){.bulk-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.bulk-grid{grid-template-columns:1fr;}}
.bulk-card{background:var(--cream);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease;}
.bulk-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(42,33,24,0.14);}
.bulk-photo{aspect-ratio:4/3;overflow:hidden;background:var(--ivory);}
.bulk-photo img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
.bulk-card:hover .bulk-photo img{transform:scale(1.06);}
.bulk-body{padding:22px;}
.bulk-name{font-family:'Cinzel Decorative',serif;font-size:17px;color:var(--ink);margin-bottom:4px;}
.bulk-size{font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--text-dim);margin-bottom:14px;}
.bulk-note{font-size:12px;color:var(--text-dim);line-height:1.6;margin-bottom:18px;}
.bulk-price-btn{display:block;text-align:center;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;background:var(--ink);color:var(--gold-pale);padding:13px 16px;border-radius:2px;transition:all .25s ease;}
.bulk-price-btn:hover{background:var(--gold);color:var(--ink);}

/* SAMPLE PROOF */
.sample-section{background:var(--cream);}
.sample-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:700px;margin:0 auto 20px;}
@media(max-width:560px){.sample-grid{grid-template-columns:1fr;}}
.sample-photo{border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:0 12px 30px rgba(42,33,24,0.1);}
.sample-photo img{aspect-ratio:1/1;object-fit:cover;}

/* GIFT BOX */
.giftbox-banner{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-bright) 100%);border-radius:12px;padding:32px 24px;text-align:center;max-width:820px;margin:0 auto;}
.giftbox-banner p:first-child{font-family:'Cinzel',serif;font-size:14px;letter-spacing:0.04em;color:var(--ink);margin-bottom:8px;font-weight:600;}
.giftbox-banner p:last-child{font-size:12.5px;color:rgba(42,33,24,0.8);}

/* WHY WHOLESALE */
.why-section{background:var(--paper);}
.why-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
@media(max-width:760px){.why-grid{grid-template-columns:1fr;}}
.why-card{text-align:center;padding:10px;}
.why-icon{font-size:26px;margin-bottom:14px;}
.why-title{font-family:'Cinzel',serif;font-size:13.5px;color:var(--ink);margin-bottom:10px;font-weight:600;}
.why-text{font-size:12.5px;color:var(--text-dim);line-height:1.7;}

/* FINAL CTA */
.final-cta{background:linear-gradient(165deg,var(--gold-pale) 0%,var(--cream) 100%);text-align:center;}
.final-cta-box{max-width:640px;margin:0 auto;border:1px solid var(--gold);border-radius:10px;padding:56px 40px;background:var(--paper);}
.final-cta-title{font-family:'Cinzel Decorative',serif;font-size:clamp(22px,3vw,30px);color:var(--ink);margin-bottom:16px;}
.final-cta-text{font-size:14.5px;color:var(--ink-soft);line-height:1.8;margin-bottom:30px;font-weight:300;}
.final-cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.final-btn-fill{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;background:var(--ink);color:var(--gold-pale);padding:16px 30px;border-radius:2px;}
.final-btn-fill:hover{background:var(--gold);color:var(--ink);}
.final-btn-outline{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;background:transparent;color:var(--ink-soft);border:1px solid var(--ink-soft);padding:16px 30px;border-radius:2px;}

.back-to-shop{background:var(--ivory);text-align:center;padding:50px 24px;}
.back-to-shop a{display:inline-block;font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;color:var(--ink-soft);}
.back-to-shop a:hover{color:var(--gold);}

footer{background:var(--ink);color:rgba(251,248,242,0.6);padding:40px 24px;text-align:center;font-size:12px;}
footer a{color:var(--gold-pale);}
</style>
</head>
